; Copy to user://net_connectivity.cfg (NOT committed with secrets).
; SEMI_ASYNC §7 / RELEASE_AND_HOTUPDATE §0.1
; Deploy: tools/deploy_net_connectivity.ps1

[net]
public_stun_enabled=true
stun_urls="stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
signaling_url=""
; Cross-network ENet fallback targets (comma-separated). Tried AFTER LAN/IPv4/IPv6/reflexive.
; NOT written into invite reflexive — that slot is STUN/UPnP only.
; Examples:
;   turn_urls="192.168.3.4:27001"
;   turn_urls="udp:203.0.113.10:3478"
; Point at a reachable mapping to the host listen port (24567+room_code),
; or at tools/eac_udp_relay.py --listen <port> --forward <24567+code>.
; turn_user / turn_pass reserved for future coturn ICE (not used by ENet path yet).
turn_urls=""
turn_user=""
turn_pass=""
upnp_enabled=true
combat_logic_hz=30
full_sync_interval_logic_ticks=60
light_sync_interval_logic_ticks=6
sync_interval_logic_ticks=6
light_min_interval_ms=100
light_max_gap_ms=500
guest_extrapolate_max_s=1.0
guest_pos_smooth_s=0.15
guest_hp_correct_smooth_s=0.3
wire_compress_min_bytes=512
anticheat_gap_streak_to_investigate=3
anticheat_gap_hp_rel=0.05
invite_blob_enabled=true
