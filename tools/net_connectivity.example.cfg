; Copy to user://net_connectivity.cfg (NOT committed with secrets).
; SEMI_ASYNC §7 / RELEASE_AND_HOTUPDATE §0.1

[net]
public_stun_enabled=true
stun_urls="stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
signaling_url=""
; Self-hosted coturn example — fill locally / private ops only:
turn_urls=""
turn_user=""
turn_pass=""
combat_logic_hz=30
full_sync_interval_logic_ticks=60
light_sync_interval_logic_ticks=6
; Legacy alias for light cadence:
sync_interval_logic_ticks=6
; §3.4 host light cadence (wall clock): >=4 light packets between two full snapshots.
light_min_interval_ms=100
light_max_gap_ms=500
; §3.1a guest dead reckoning.
guest_extrapolate_max_s=1.0
guest_pos_smooth_s=0.15
guest_hp_correct_smooth_s=0.3
; §3.3.1 zstd threshold — light packets stay raw, full snapshots compress.
wire_compress_min_bytes=512
anticheat_gap_streak_to_investigate=3
anticheat_gap_hp_rel=0.05
invite_blob_enabled=true
